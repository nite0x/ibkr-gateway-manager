name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/ibkr-gateway-manager
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact=100 --no-banner --log-opts=--all .
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact=100 --no-banner .
      - run: python3 scripts/check-doc-links.py
      - run: node --check internal/service/web/manager.js && node --check internal/service/web/gateway-cookie-scope.js
      - name: Validate Compose files
        env:
          IBKR_GATEWAY_MANAGER_USERNAME: ci
          IBKR_GATEWAY_MANAGER_PASSWORD: ci-example-password
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null -f compose.local.yaml config --quiet

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t ibkr-gateway-manager:ci .
      - run: python3 scripts/smoke-image.py ibkr-gateway-manager:ci
