name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/ibkr-gateway-manager
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact=100 --no-banner --log-opts=--all .
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact=100 --no-banner .
      - run: python3 scripts/check-doc-links.py
      - run: node --check internal/service/web/manager.js && node --check internal/service/web/gateway-cookie-scope.js
      - name: Validate Compose files
        env:
          IBKR_GATEWAY_MANAGER_USERNAME: ci
          IBKR_GATEWAY_MANAGER_PASSWORD: ci-example-password
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null -f compose.local.yaml config --quiet

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare release image name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || (( ${#GITHUB_REF_NAME} > 128 )); then
            echo "::error::Use a version tag such as v0.1.1 or v0.2.0-rc.1"
            exit 1
          fi
          image_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "RELEASE_IMAGE=ghcr.io/$image_repository:$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Build image for Railway
        shell: bash
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            -t ibkr-gateway-manager:ci .
      - run: python3 scripts/smoke-image.py ibkr-gateway-manager:ci
      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          docker tag ibkr-gateway-manager:ci "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
          echo "Published: \`$RELEASE_IMAGE\` (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
